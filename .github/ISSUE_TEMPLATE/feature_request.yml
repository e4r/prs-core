name: Feature request
description: Propose a new function, option or model extension
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do that the library does not support?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Sketch the function signature or behaviour. If it implements a published model, cite the source.
      render: typescript
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
