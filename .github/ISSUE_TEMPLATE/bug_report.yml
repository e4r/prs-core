name: Bug report
description: Something behaves incorrectly or contradicts the documentation
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. For security issues, **do not** open a public issue — see [SECURITY.md](https://github.com/e4r/prs-core/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A short code snippet that reproduces the problem, with the exact inputs and the output you got.
      render: typescript
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: '@e4r/prs-core version'
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Node.js version / browser / bundler, and ESM or CommonJS.
      placeholder: Node 22.12, ESM
